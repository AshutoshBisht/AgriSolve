services:
  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: agrisolve-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        value: aws-us-east-1
      - key: PINECONE_INDEX_NAME
        value: agrisolve
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false          # set to your Vercel URL after frontend deploy
