services:
  - type: web
    name: agrisolve-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # ── Required secrets — set these in the Render dashboard ──────────────
      - key: PINECONE_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
      # ── Set this AFTER the frontend is deployed to Vercel ─────────────────
      # e.g. https://agrisolve.vercel.app  (no trailing slash)
      - key: FRONTEND_URL
        sync: false
      # ── Pre-filled safe defaults ───────────────────────────────────────────
      - key: PINECONE_ENVIRONMENT
        value: aws-us-east-1
      - key: PINECONE_INDEX_NAME
        value: agrisolve
